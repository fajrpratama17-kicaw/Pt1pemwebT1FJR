<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Pemrograman Web</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
            border-top: 5px solid #00bcd4;
        }
        h1 {
            color: #333;
            font-size: 26px;
            margin-bottom: 25px;
        }
        .info-group {
            margin-bottom: 15px;
        }
        .label {
            font-size: 14px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .value {
            font-size: 20px;
            color: #222;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Pemrograman Web</h1>
        <div class="info-group">
            <div class="label">Nama</div>
            <div class="value">Fajar Pratama</div>
        </div>
        <div class="info-group">
            <div class="label">NPM</div>
            <div class="value">243510867</div>
        </div>
        <div class="info-group">
            <div class="label">Kelas</div>
            <div class="value">4F PrakPemWeb</div>
        </div>
    </div>

    <img src="Cuplikan layar 2026-05-18 021116.png" alt="ini gambar profil">
</body>
</html>
